<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты — QazaqRepublic</title>
<meta name="description" content="Цех, шоурум и доставка QazaqRepublic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0c0e'/%3E%3Cpath d='M6 24L12 8l6 16 6-16' fill='none' stroke='%23ff4d1f' stroke-width='3.4' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="qrHeader"><nav class="nav nav--fallback" aria-label="Основная навигация"><a class="nav__link" href="index.html">Главная</a><a class="nav__link" href="catalog.html">Магазин</a><a class="nav__link" href="catalog.html?cat=hudi">Худи</a><a class="nav__link" href="catalog.html?cat=svitshot">Свитшоты</a><a class="nav__link" href="catalog.html?cat=futbolka">Футболки</a><a class="nav__link" href="catalog.html?cat=niz">Брюки</a><a class="nav__link" href="catalog.html?cat=sumka">Сумки</a><a class="nav__link" href="catalog.html?cat=giftbox">Подарочные</a><a class="nav__link" href="about.html">О бренде</a><a class="nav__link" href="contacts.html">Контакты</a></nav></div>
<div id="qrMenu"></div>

<div class="page-head">
  <div class="wrap">
    <nav class="crumbs">
      <a href="index.html" data-i18n="nav.home">Главная</a>
      <span class="ic" data-chev></span>
      <span data-i18n="nav.contacts">Контакты</span>
    </nav>
    <h1 class="display h-lg" data-i18n="contact.title">Связаться с нами</h1>
    <p class="lead" style="margin-top:12px" data-i18n="contact.sub">Магазин, самовывоз и доставка</p>
  </div>
</div>

<div class="wrap" style="padding-block:clamp(26px,4vw,54px)">
  <div class="contacts">
    <div class="cinfo" id="qrInfo" data-rv="left"></div>

    <div data-rv="right">
      <div class="panel" style="margin:0 0 18px">
        <h2 class="panel__t" data-i18n="contact.form">Написать нам</h2>
        <form id="cForm" novalidate>
          <div class="form-grid">
            <div class="field"><label for="cName">Имя</label><input class="input" id="cName" placeholder="Имя"><span class="err-msg"></span></div>
            <div class="field"><label for="cPhone">Телефон</label><input class="input" id="cPhone" type="tel" placeholder="+7 701 572 24 40"><span class="err-msg"></span></div>
            <div class="field span2"><label for="cMail">Email</label><input class="input" id="cMail" type="email" placeholder="name@mail.kz"><span class="err-msg"></span></div>
            <div class="field span2"><label for="cMsg" data-i18n="contact.msg">Сообщение</label><textarea class="textarea" id="cMsg" placeholder="Напишите, что вам нужно"></textarea><span class="err-msg"></span></div>
          </div>
          <button class="btn btn-gold btn-lg" type="submit" style="margin-top:20px" data-i18n="contact.send">Отправить</button>
        </form>
      </div>

      <div class="map">
        <div class="map__grid"></div>
        <span class="map__pin"><span class="ic" data-ic="pin"></span></span>
        <span class="map__label" id="qrMapLabel">Алматы, ул. Маметовой 47</span>
      </div>
    </div>
  </div>
</div>

<div class="orn-div" data-orn></div>

<section class="section">
  <div class="wrap">
    <div class="sec-head">
      <div class="sec-head__t">
        <span class="eyebrow">FAQ</span>
        <h2 class="display h-lg" data-i18n="contact.faq">Частые вопросы</h2>
      </div>
    </div>
    <div class="faq acc" id="qrFaq"></div>
  </div>
</section>

<div id="qrFooter"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/images.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/contacts.js"></script>
</body>
</html>
